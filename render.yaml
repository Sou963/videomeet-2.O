services:
  - type: web
    name: videomeet-frontend-sou963
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_PUBLIC_API_URL
        value: https://videomeet-backend-uyms.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://videomeet-backend-uyms.onrender.com
